  <text x="380" y="530" font-family="sans-serif" font-size="11" fill="#0F6E56">• 同频沟通: 看领导类型调整</text>
  <text x="380" y="548" font-family="sans-serif" font-size="11" fill="#0F6E56">• 越级艺术: 让+1成为明星老板</text>
