  <text x="80" y="1006" font-family="sans-serif" font-size="11" fill="#993556">沟通从职场拓展到人生:</text>
  <text x="80" y="1024" font-family="sans-serif" font-size="11" fill="#993556">• 与他人沟通 — 单向→双向</text>
